{% extends 'layout.html' %}

{% block site_content %}

<div class="container mt-5">
    
    <div class="row justify-content-center">
        
        <div class="col-md-5">
            
            <div class="card shadow-lg p-4">
                
                <h3 class="text-center mb-4">Criar Conta</h3>

                <form id="cadastrar-form">

                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text" id="nome" class="form-control" placeholder="Digite seu nome">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="Digite seu email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" id="password" class="form-control" placeholder="Crie uma senha">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirmar Senha</label>
                        <input type="password" id="confirmar-password" class="form-control" placeholder="Repita a senha">
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Cadastrar
                    </button>

                    <div id="message"></div>

                </form>

                <div class="text-center mt-3">
                    <small>
                        Já tem conta? <a href="/dev/loja-virtual/public/login">Entrar</a>
                    </small>
                </div>

            </div>

        </div>

    </div>

</div>

<script>
    document.getElementById('cadastrar-form').addEventListener('submit', function (e) {
        e.preventDefault();

        const nome = document.getElementById('nome').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const confirmarPassword = document.getElementById('confirmar-password').value.trim();
        const messageDiv = document.getElementById("message");

        if (!nome || !email || !password || !confirmarPassword) {
            messageDiv.textContent = "Preencha Todos os campos.";
            messageDiv.className = "error";
            return;
        }

        if (password != confirmarPassword) {
            messageDiv.textContent = "A senha esta diferente uma da outra";
            messageDiv.className = "error";
            return;
        }

        fetch('/dev/loja-virtual/public/api/cadastrar', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                'nome' : nome,
                'email' : email,
                'password' : password
            })
        })
        .then(response => response.json())
        .then(data => {
            console.log(data);
        })
        .catch(error => {
            console.log('Erro:', error);
        })
    })
</script>

{% endblock %}
