{% extends 'layout.html' %}


{% block site_content %}

<div class="album py-5 bg-body-tertiary">
  <div class="container">
    <div id="listar-busca" class="row row-cols-1 row-cols-md-3 g-3">

    </div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const termo = params.get('b');

  fetch(`/dev/loja-virtual/public/api/busca?b=${termo}`, {
    method: 'GET'
  })
    .then(response => response.json())
    .then(data => {
      
      if (data.success) {
        let html = '';

        data.produtos.forEach(produto => {
          html += `<div class="col">
          <div class="card shadow-sm">

            <svg
              aria-label="Placeholder: Thumbnail"
              class="bd-placeholder-img card-img-top"
              height="225"
              preserveAspectRatio="xMidYMid slice"
              role="img"
              width="100%"
              xmlns="http://www.w3.org/2000/svg"
            >
              <title>Placeholder</title>
              <rect width="100%" height="100%" fill="#55595c"></rect>
              <text x="50%" y="50%" fill="#eceeef" dy=".3em">
                Thumbnail
              </text>
            </svg>

            <div class="card-body">
              <p class="card-text">${produto.nome}</p>
              <p class="card-text">${produto.preco}</p>

              <div class="d-flex justify-content-between align-items-center">
                <div class="btn-group">
                  <a href="/dev/loja-virtual/public/categoria/${produto.categoria_nome}/${produto.produto_slug}" class="btn btn-primary">
                    Ver produto
                  </a>
                  <a href="#" data-id="${produto.id}" class="btn btn-sm btn-outline-secondary btn-add-carrinho">
                    carrinho
                  </a>
                </div>
                <small class="text-body-secondary">9 mins</small>
              </div>
            </div>

          </div>
        </div>`
        });

        document.getElementById('listar-busca').innerHTML = html;
      }
    })
    .catch(error => {
      console.log('Erro:', error);
    })
</script>

{% endblock %}
