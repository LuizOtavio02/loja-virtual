{% extends 'layout.html' %}


{% block site_content %}
<div class="container">
    <h1>Carrinho</h1>
    <table class="table">
        <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">Nome</th>
                <th scope="col">Preço</th>
                <th scope="col">Quantidade</th>
                <th scope="col">Valor Total</th>
                <th scope="col">Remover Produto</th>
            </tr>
        </thead>
        <tbody id="tbody">

        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">
                    <strong>Total da Compra: R$ {{ valorTotalCarrinho | number_format(2,',','.') }}</strong>
                </td>
            </tr>
        </tfoot>
    </table>
</div>

<script src="{{ site_url() }}/assets/js/site_carrinho.js"></script>

{% endblock %}
