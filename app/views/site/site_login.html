{% extends 'layout.html' %}

{% block site_content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-4">

            <div class="card shadow-lg p-4">

                <h3 class="text-center mb-4">Entrar</h3>

                <form id="login-form">

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="Digite seu email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" id="password" class="form-control" placeholder="Digite sua senha" required>
                    </div>

                    <button type="submit" id="submit" class="btn btn-primary w-100">
                        Entrar
                    </button>

                </form>

                <div id="message"></div>

                <div class="text-center mt-3">
                    <small>
                        Não tem conta? <a href="/dev/loja-virtual/public/cadastrar">Cadastre-se</a>
                    </small>
                </div>

            </div>

        </div>

    </div>

</div>

<script>
    document.getElementById('login-form').addEventListener('submit', function (e) {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const messageDiv = document.getElementById("message");

        if (!email || !password) {
            messageDiv.textContent = "Preencha ambos os campos.";
            messageDiv.className = "error";
            return;
        }

        fetch('/dev/loja-virtual/public/api/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                'email': email,
                'password': password
            })
        }).then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.history.back()
                } else {
                    messageDiv.textContent = "Email ou Senha estão errados";
                    messageDiv.className = "error";
                }
            })
            .catch(error => {
                console.log('Erro:', error);
            })
    })
</script>

{% endblock %}
